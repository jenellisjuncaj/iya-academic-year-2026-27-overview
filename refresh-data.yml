name: Refresh academic year snapshots
on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: academic-year-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import semester snapshots
        run: node scripts/refresh-data.js
      - name: Test calculations and source parity
        run: node tests.js
      - name: Commit snapshots and status
        run: |
          git add data.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh academic year semester snapshots"
          git push
